### FCode choice SFT — full run
### 5.2k train / 782 val; packet prompt, one candidate id per response.
model_name_or_path: /root/fcode-sft/models/Qwen3-4B-Instruct-2507
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
quantization_method: bnb
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset: fcode_choice_train
eval_dataset: fcode_choice_val
dataset_dir: /root/fcode-sft/data
template: qwen3
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 2
dataloader_num_workers: 0

output_dir: /root/fcode-sft/saves/choice-full
logging_steps: 5
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: true
gradient_checkpointing: true
optim: paged_adamw_8bit

eval_strategy: steps
eval_steps: 200
per_device_eval_batch_size: 1
