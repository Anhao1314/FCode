### FCode SFT — full run (T4 16GB, QLoRA)
### ~2346 samples, 2 epochs, expect 2.5-4 h on a T4. Check loss curve + adapter.
model_name_or_path: /root/fcode-sft/models/Qwen3-4B-Instruct-2507
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
quantization_method: bnb
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### dataset
dataset: fcode_sft_full
template: qwen3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 2
dataloader_num_workers: 0

### output
output_dir: /root/fcode-sft/saves/full
logging_steps: 5
save_steps: 200
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: true
gradient_checkpointing: true
optim: paged_adamw_8bit

### eval — the real acceptance test is the runtime (7 scenarios), not val loss.
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
