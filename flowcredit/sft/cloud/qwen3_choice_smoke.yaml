### FCode choice SFT — smoke (200 samples, 1 epoch)
### Goal: prove the packet prompt/labels train before spending on a full run.
model_name_or_path: /root/fcode-sft/models/Qwen3-4B-Instruct-2507
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
quantization_method: bnb
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset: fcode_choice_train
eval_dataset: fcode_choice_val
dataset_dir: /root/fcode-sft/data
template: qwen3
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 2
dataloader_num_workers: 0
max_samples: 200

output_dir: /root/fcode-sft/saves/choice-smoke
logging_steps: 5
save_steps: 100
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: true
gradient_checkpointing: true
optim: paged_adamw_8bit

eval_strategy: steps
eval_steps: 50
per_device_eval_batch_size: 1
