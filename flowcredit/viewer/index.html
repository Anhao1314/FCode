<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fcode · flowcredit console</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="shell app rail-open" id="app">

  <aside class="sidebar">
    <div class="side-actions">
      <button class="icon-btn" id="open-file" title="打开 trace JSON">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="export" title="导出原始 JSON">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      </button>
      <button class="icon-btn" id="replay-side" title="重放当前场景 (R)">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
      <button class="kbtn" id="palette-btn" title="命令面板 (⌘K)">⌘K</button>
    </div>

    <div class="side-list">
      <div class="side-group" id="run-group" hidden>
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
        <span>运行记录</span>
        <input class="run-search" id="run-search" placeholder="搜索…" spellcheck="false">
      </div>
      <nav class="nav" id="run-nav"></nav>
      <div class="side-group">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span>演示场景</span>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>

    <div class="side-foot">
      <span class="avatar">F</span>
      <div class="who grow">
        <div class="who-name">Fcode</div>
        <div class="who-sub" id="foot-text">offline-mock · 只读回放</div>
      </div>
      <button class="icon-btn" id="reverify" title="重新验证签名链">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="m9.5 12 2 2 3.5-4"/></svg>
      </button>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="tb-title" id="tb-title">—</div>
      <div class="tb-chips" id="tb-chips"></div>
      <div class="grow"></div>
      <div class="chain-pill" id="chain-badge"><span class="dot"></span><span>未加载</span></div>
      <button class="icon-btn" id="rail-toggle" title="事件面板">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </header>

    <div class="content">
      <div class="center">
        <main class="main">
          <div class="main-inner" id="main">
            <div class="empty">在下方派一个任务，或从左侧选择一条运行记录 / 演示场景。<br><span class="dim">trace JSON 也可以直接拖进窗口。</span></div>
          </div>
        </main>
        <footer class="composer-wrap">
          <div class="composer">
            <div class="composer-box" id="composer-box">
              <div class="tpl-menu approval-menu" id="approval-menu" hidden></div>
              <div class="tpl-menu" id="tpl-menu" hidden></div>
              <textarea class="composer-ta" id="composer-ta" rows="1"
                placeholder="给 agent 派一个任务：判断 2024 与 2025 两期合并毛利率是否可比…"></textarea>
              <div class="composer-bar">
                <button class="c-icon" id="composer-open" title="打开 trace JSON">
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="c-btn" id="template-btn" title="选择任务模板（决定授权与预算）">
                  <svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
                  <span id="template-label">完整研究</span>
                  <svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <button class="c-btn" id="approval-btn" title="审批档位：只在需要你确认的地方暂停（对新任务生效）">
                  <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  <span id="approval-label">关键审批</span>
                  <svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="grow"></div>
                <span class="c-btn static run-chip" id="run-chip" hidden>
                  <span class="pdot"></span><span id="run-chip-text">运行中</span>
                </span>
                <span class="c-btn static" title="离线确定性 mock 模型">
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/></svg>
                  offline-mock
                </span>
                <button class="send" id="send" title="发送任务" disabled>
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>

      <aside class="rail">
        <div class="rail-head">
          <div class="seg" id="rail-tabs">
            <button data-tab="events" class="active">事件</button>
            <button data-tab="chain">链</button>
            <button data-tab="raw">原始</button>
          </div>
        </div>
        <div class="rail-body" id="rail-body"></div>
      </aside>
    </div>
  </div>

</div>
<input type="file" id="pick" hidden accept=".json,application/json">

<div class="palette" id="palette" hidden>
  <div class="palette-scrim" data-palette-close></div>
  <div class="palette-box" role="dialog" aria-label="命令面板">
    <input class="palette-input" id="palette-input" placeholder="输入命令，或搜索运行与场景…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot"><span>↑↓ 选择</span><span>↵ 执行</span><span>esc 关闭</span><div class="grow"></div><span>⌘K 面板 · ⌘. 停止 · 审批 ⌘↵ 允许 / ⌘⌫ 拒绝</span></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
