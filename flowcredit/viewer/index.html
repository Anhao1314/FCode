<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Fcode · flowcredit console</title>
<link rel="stylesheet" href="app.css?v=13">
</head>
<body>
<div class="shell app rail-open" id="app">

  <aside class="sidebar">
    <div class="side-head">
      <span class="side-brand">FCode</span>
      <button class="kbtn" id="palette-btn" title="命令面板 (⌘K)">⌘K</button>
    </div>

    <button class="side-new" id="new-run">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建委托</span>
    </button>

    <label class="side-search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="run-search" placeholder="搜索运行记录…" autocomplete="off" spellcheck="false">
    </label>

    <button class="side-desk" id="desk-btn" title="委托汇总与成本账本">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 20V10"/></svg>
      <span>工作台 · 账本</span>
    </button>

    <div class="side-list">
      <nav class="nav" id="run-nav"></nav>

      <section class="side-scenes" id="scene-section">
        <button class="side-group scene-toggle" id="scene-toggle" aria-expanded="false">
          <span class="chev">▸</span>
          <span>示例场景</span>
          <span class="side-count" id="scene-count">7</span>
        </button>
        <nav class="nav" id="nav"></nav>
      </section>
    </div>

    <div class="side-foot">
      <span class="fdot" id="foot-dot"></span>
      <span class="foot-text" id="foot-text">offline-mock · 只读回放</span>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="tb-title" id="tb-title">—</div>
      <div class="tb-chips" id="tb-chips"></div>
      <div class="grow"></div>
      <button class="chain-pill" id="chain-badge" type="button" title="点击重新验证签名链"><span class="dot"></span><span>未加载</span></button>
      <button class="icon-btn" id="rail-toggle" title="事件面板">
        <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
      </button>
    </header>

    <div class="tabs" id="tabs" hidden></div>

    <div class="content">
      <div class="center">
        <main class="main">
          <div class="main-inner" id="main">
            <div class="empty">给 agent 派一个工作委托，或从左侧打开运行记录 / 示例场景。<br>
              <span class="dim">每个数字有来源，每次计算被复算，每份底稿不可篡改。</span><br>
              <button class="a-btn strong" data-wizard-open style="margin-top:14px">创建第一个委托</button>
            </div>
          </div>
        </main>
        <footer class="composer-wrap">
          <div class="composer">
            <div class="composer-box" id="composer-box">
              <div class="tpl-menu approval-menu" id="approval-menu" hidden></div>
              <div class="tpl-menu" id="tpl-menu" hidden></div>
              <textarea class="composer-ta" id="composer-ta" rows="1"
                placeholder="给 agent 派一个任务：判断 2024 与 2025 两期合并毛利率是否可比…"></textarea>
              <div class="composer-bar">
                <button class="c-icon" id="composer-open" title="新建委托">
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="c-btn" id="template-btn" title="选择任务模板（决定授权与预算）">
                  <svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/></svg>
                  <span id="template-label">完整研究</span>
                  <svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <button class="c-btn" id="approval-btn" title="审批档位：只在需要你确认的地方暂停（对新任务生效）">
                  <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                  <span id="approval-label">关键审批</span>
                  <svg class="i" viewBox="0 0 24 24" style="width:12px;height:12px"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="grow"></div>
                <button class="c-btn static run-chip" id="run-chip" hidden title="在轮次边界停止运行（⌘.）">
                  <span class="pdot"></span><span id="run-chip-text" aria-live="polite">运行中</span>
                </button>
                <span class="c-btn static" title="离线确定性 mock 模型">
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/></svg>
                  offline-mock
                </span>
                <button class="send" id="send" title="发送任务" disabled>
                  <svg class="i" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
        </footer>
      </div>

      <aside class="rail">
        <div class="rail-head">
          <div class="seg" id="rail-tabs">
            <button data-tab="events" class="active">事件</button>
            <button data-tab="chain">链</button>
            <button data-tab="raw">原始</button>
          </div>
        </div>
        <div class="rail-body" id="rail-body"></div>
      </aside>
    </div>
    <div class="statusline" id="statusline"></div>
  </div>

</div>
<input type="file" id="pick" hidden accept=".json,application/json">

<div class="palette" id="palette" hidden>
  <div class="palette-scrim" data-palette-close></div>
  <div class="palette-box" role="dialog" aria-label="命令面板">
    <input class="palette-input" id="palette-input" placeholder="输入命令，或搜索运行与场景…" autocomplete="off" spellcheck="false">
    <div class="palette-list" id="palette-list"></div>
    <div class="palette-foot"><span>↑↓ 选择</span><span>↵ 执行</span><span>esc 关闭</span><div class="grow"></div><span>⌘K 面板 · ⌘. 停止 · 审批 ⌘↵ 允许 / ⌘⌫ 拒绝</span></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<div class="wizard-layer" id="wizard-layer" hidden>
  <div class="report-scrim" data-wz-close></div>
  <div class="wizard-panel">
    <div class="report-bar">
      <span class="report-title">新委托 <span class="dim" id="wizard-step">1 / 3</span></span>
      <span class="grow"></span>
      <button class="icon-btn" id="wizard-close" title="关闭 (Esc)">×</button>
    </div>
    <div class="wizard-body" id="wizard-body"></div>
    <div class="wizard-foot" id="wizard-foot"></div>
  </div>
</div>

<div class="report-layer" id="report-layer" hidden>
  <div class="report-scrim" data-report-close></div>
  <div class="report-panel">
    <div class="report-bar">
      <span class="report-title" id="report-title">工作底稿预览</span>
      <span class="grow"></span>
      <button class="a-btn" id="report-print" title="通过系统打印对话框存为 PDF">打印 / 存为 PDF</button>
      <button class="a-btn strong" id="report-download" title="下载自包含 HTML（可离线打开、转发、独立验证）">下载报告</button>
      <button class="icon-btn" id="report-close" title="关闭 (Esc)">×</button>
    </div>
    <iframe class="report-frame" id="report-frame" title="报告预览"></iframe>
  </div>
</div>

<script src="report.js?v=13"></script>
<script src="app.js?v=13"></script>
</body>
</html>
