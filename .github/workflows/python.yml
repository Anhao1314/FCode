name: Python runtime

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm there is nothing to install
        working-directory: flowcredit
        run: |
          python -c "import tomllib,sys; d=tomllib.load(open('pyproject.toml','rb')); deps=d['project'].get('dependencies',[]); print('runtime dependencies:', deps); sys.exit(1 if deps else 0)"

      - name: Run unit and scenario tests
        working-directory: flowcredit
        run: python -m unittest discover -s tests -v

      - name: Select Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run viewer pure-function tests
        working-directory: flowcredit
        run: node --test viewer/tests/*.test.js

      - name: Run every scenario through the CLI
        working-directory: flowcredit
        run: python demo.py all

      - name: Smoke test the zero-config entry point
        working-directory: flowcredit
        run: python demo.py full --fast

      - name: Confirm verification did not modify tracked files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  all-checks-passed:
    # 单一聚合门：四条矩阵腿没有聚合时，红了不知道算不算过、绿了也没有单一信号。
    # 分支保护只挂这一个 check（矩阵腿的结论由它汇总）。
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every verify leg must have succeeded
        run: |
          echo "verify matrix: ${{ needs.verify.result }}"
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "::error::one or more verify legs failed (or were cancelled)"
            exit 1
          fi
