name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "flowcredit/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: FCode-macos
          - os: windows-latest
            artifact: FCode-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop/requirements.txt

      - name: Build bundle
        working-directory: desktop
        run: pyinstaller --clean --noconfirm fcode.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd desktop/dist
          ditto -c -k --keepParent FCode.app FCode-macos.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path desktop/dist/FCode -DestinationPath desktop/dist/FCode-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: desktop/dist/*.zip

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.zip
